<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>RPGA Gym</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#101827}.top{background:#fff;padding:calc(28px + env(safe-area-inset-top)) 24px 18px;border-bottom:1px solid #ddd}.top h1{font-size:25px;margin:0 0 8px}.sub{color:#697386;font-size:18px}.page{padding:22px 18px 105px;max-width:720px;margin:auto}.card{background:white;border:1px solid #dde1e6;border-radius:18px;margin-bottom:18px;overflow:hidden}.pad{padding:20px}.date{color:#697386;font-size:17px}h2{font-size:29px;margin:8px 0 24px}label{display:block;font-weight:700;color:#687182;margin:14px 0 7px}select,input{width:100%;padding:16px;border:1px solid #d9dde4;border-radius:14px;background:white;font-size:18px}.btn{width:100%;border:0;border-radius:14px;padding:17px;font-size:18px;font-weight:750;background:#101827;color:white;margin-top:18px}.outline{background:white;color:#101827;border:1px solid #d9dde4}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sectionTitle{font-weight:800;font-size:20px;padding:18px;border-bottom:1px solid #e1e4e8}.round{font-weight:800;font-size:18px;padding:14px 20px;background:#fbfbfc;border-bottom:1px solid #e5e7eb}.ex{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:16px 20px;border-bottom:1px solid #e5e7eb}.ex input{width:28px;height:28px}.name{font-weight:750;font-size:17px}.reps{color:#6b7280;margin-top:4px}.video{background:#eef1f4;padding:10px 13px;border-radius:14px;text-decoration:none;color:#101827;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:9}.nav button{border:0;background:none;padding:9px 2px;font-weight:700;color:#697386}.nav button.on{color:#101827}.hidden{display:none}.historyrow{padding:15px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between}.pct{background:#eef1f4;border-radius:30px;padding:10px}.progress{height:13px;background:#e7e9ed;border-radius:9px;overflow:hidden}.bar{height:100%;background:#101827}.week{padding:18px 20px;border-top:1px solid #e5e7eb}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.day{text-align:center;font-size:12px}.dot{margin:5px auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#edf0f3}.done .dot{background:#101827;color:#fff}.small{color:#6b7280;font-size:14px}.homeback{border:0;background:none;font-weight:750;font-size:16px;padding:0 0 15px}.stat{font-size:30px;font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.statbox{background:#f5f6f8;border-radius:14px;padding:16px}

.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.segment label{margin:0;position:relative}
.segment input{position:absolute;opacity:0;width:1px;height:1px}
.segment span{display:block;text-align:center;padding:13px 8px;border:1px solid #d9dde4;border-radius:13px;font-weight:750;color:#687182;background:#fff}
.segment input:checked+span{background:#101827;color:#fff;border-color:#101827}
textarea{width:100%;min-height:105px;padding:14px;border:1px solid #d9dde4;border-radius:14px;font:inherit;resize:vertical}
.timerbox{font-size:38px;font-weight:800;letter-spacing:1px;text-align:center;padding:14px 0}
.timerbuttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timerbuttons button{margin-top:0}
.meta{padding:16px 20px;border-bottom:1px solid #e5e7eb}
</style></head><body><header class="top"><h1>RPGA Gym</h1><div class="sub">Block 1 · Early Athletic Development for Golf</div></header><main class="page">
<section id="home"><div class="card pad"><div class="date" id="today"></div><h2>Start a Workout</h2><label>Workout date</label><input type="date" id="workDate"><label>Lesson</label><select id="lesson"><option value="1">Lesson 1</option><option value="2">Lesson 2</option><option value="3">Lesson 3</option></select><button class="btn" onclick="startWorkout()">Start / Continue Workout</button><div class="twocol"><button class="btn outline" onclick="showTab('history')">History</button><button class="btn outline" onclick="resumeLast()">Resume Last</button></div></div><div class="card"><div class="sectionTitle">Recent workouts</div><div id="recent"></div></div></section>
<section id="workout" class="hidden"><button class="homeback" onclick="showTab('home')">‹ Start a Workout</button><div id="workoutTitle"></div>
<div class="card pad"><div class="sectionTitle" style="padding:0 0 12px;border:0">Workout Type</div><div class="segment">
<label><input type="radio" name="workoutType" value="Independent" onchange="setWorkoutType(this.value)"><span>✓ Independent</span></label>
<label><input type="radio" name="workoutType" value="With Coach" onchange="setWorkoutType(this.value)"><span>✓ With Coach</span></label>
</div></div>
<div id="workoutBody"></div>
<div class="card pad"><div class="sectionTitle" style="padding:0 0 12px;border:0">Finish Workout</div>
<label>Start time</label><input type="time" id="startTime" onchange="setMeta()">
<label>Training timer</label><div class="timerbox" id="timerDisplay">00:00:00</div><div class="timerbuttons"><button class="btn" id="timerBtn" onclick="toggleTimer()">Start Timer</button><button class="btn outline" onclick="resetTimer()">Reset Timer</button></div>
<label>Total training minutes</label><input type="number" min="0" id="totalMinutes" placeholder="Minutes" onchange="setMeta()">
<label>Notes to Coach</label><textarea id="coachNotes" placeholder="Feedback, questions, anything you want your coach to know…" oninput="setMeta()"></textarea>
<label>Note to Self</label><textarea id="selfNotes" placeholder="Personal notes about today's workout…" oninput="setMeta()"></textarea>
</div>
<div class="twocol"><button class="btn outline" onclick="resetDay()">Reset Day</button><button class="btn" onclick="saveWorkout()">Complete & Save</button></div></section>
<section id="target" class="hidden"><div class="card pad"><h2>Weekly Target</h2><label>Target workouts per week</label><input id="targetNum" type="number" min="1" max="7" value="4" onchange="setTarget()"></div><div class="card"><div class="sectionTitle" id="targetMonth"></div><div id="weeks"></div></div></section>
<section id="history" class="hidden"><div class="card pad"><h2>Workout History</h2><div class="stats"><div class="statbox"><div class="small">This week</div><div class="stat" id="weekCount">0</div><div class="small">workouts</div></div><div class="statbox"><div class="small">This month</div><div class="stat" id="monthCount">0</div><div class="small">workouts</div></div></div></div><div class="card"><div class="sectionTitle">All workouts</div><div id="allHistory"></div></div></section>
<section id="report" class="hidden"><div class="card pad"><h2>Coach Report</h2><label>Report period</label><select id="period" onchange="renderReport()"><option value="week">This Week</option><option value="month">This Month</option><option value="all">All History</option></select><pre id="reportText" style="white-space:pre-wrap;font:inherit;line-height:1.55"></pre><button class="btn" onclick="shareReport()">Share / Text / Email Report</button><button class="btn outline" onclick="emailReport()">Email Report</button></div></section>
</main><nav class="nav"><button id="n-home" class="on" onclick="showTab('home')">Workout</button><button id="n-target" onclick="showTab('target')">Target</button><button id="n-history" onclick="showTab('history')">History</button><button id="n-report" onclick="showTab('report')">Coach Report</button></nav><script src="data.js"></script><script src="app.js"></script></body></html>
